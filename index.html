<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Namgan Farm Takip Pro</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #121212; 
            color: #fff; 
            margin: 8px; 
            padding: 0;
        }
        h1 { 
            font-size: 16px; 
            text-align: center; 
            color: #ff9900; 
            margin: 6px 0;
            text-shadow: 1px 1px #000; 
        }
        .status-box {
            background-color: #770000;
            text-align: center;
            padding: 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: bold;
            margin-bottom: 8px;
            cursor: pointer;
            border: 1px solid #ff3333;
        }
        .grid-container { 
            display: flex;
            flex-direction: column;
            gap: 6px; 
            max-width: 320px; 
            margin: 0 auto;
        }
        .ch-box { 
            background-color: #1e1e1e; 
            border: 1px solid #444; 
            border-radius: 6px; 
            padding: 6px 10px; 
        }
        .ch-title { 
            font-size: 13px; 
            font-weight: bold; 
            color: #ff9900; 
            margin-bottom: 4px;
            border-bottom: 1px solid #444;
            padding-bottom: 2px;
            text-align: center;
        }
        .timer-row { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 4px; 
            background: #262626; 
            padding: 4px 8px; 
            border-radius: 4px; 
        }
        .timer-label { font-size: 12px; font-weight: 550; } 
        .timer-display { 
            font-family: monospace; 
            font-size: 14px; 
            color: #00ff00; 
            font-weight: bold; 
            margin-left: auto;
            margin-right: 10px;
        }
        .btn { 
            background-color: #ff9900; 
            color: #000; 
            border: none; 
            padding: 4px 8px; 
            font-size: 11px;
            font-weight: bold; 
            border-radius: 3px; 
            cursor: pointer; 
        }
        .btn:hover { background-color: #cc7a00; }
        .btn-test {
            background-color: #28a745;
            color: white;
            font-size: 11px;
            padding: 6px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            margin-bottom: 8px;
        }
        .btn-test:hover { background-color: #218838; }
        
        @keyframes alarm-flash {
            0% { background-color: #262626; }
            50% { background-color: #770000; }
            100% { background-color: #262626; }
        }
        .alarm-active { animation: alarm-flash 0.8s infinite; }
        .alarm-active .timer-display { color: #ff3333; }
    </style>
</head>
<body>

    <h1>⚔️ Namgan Farm Takip</h1>
    
    <!-- 🚨 SESİ ZORUNLU AKTİF ETME BUTONU -->
    <div class="status-box" id="auth-panel" onclick="unlockAudio()">
        🚨 SES KİLİDİNİ AÇMAK İÇİN BURAYA TIKLA!
    </div>
    
    <button class="btn-test" id="test-btn" onclick="testBeepSound()">🔊 ALARM SESİNİ TEST ET</button>
    
    <div class="grid-container" id="chContainer"></div>

    <script>
        const totalCH = 6;
        const container = document.getElementById('chContainer');
        let intervals = {};
        let audioCtx = null;

        // Tarayıcının ses motorunu zorla başlatan fonksiyon
        function unlockAudio() {
            try {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                
                // Başarılı olunca paneli yeşile çevir
                const panel = document.getElementById("auth-panel");
                panel.innerText = "✅ SES MOTORU AKTİF! KİLİT AÇILDI.";
                panel.style.backgroundColor = "#28a745";
                panel.style.borderColor = "#218838";
                
                // Test bip sesi çal
                playDigitalBeep(600, 0.2);
            } catch (e) {
                alert("Ses motoru başlatılamadı: " + e);
            }
        }

        // Bilgisayarın anakartından/hoparlöründen dijital ses üreten fonksiyon (İnternete bağımlı değildir)
        function playDigitalBeep(frequency, duration) {
            try {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }

                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                
                osc.type = 'sine'; // Net bip sesi
                osc.frequency.setValueAtTime(frequency, audioCtx.currentTime); 
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime); // %30 ses şiddeti
                
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch(e) {
                console.log("Ses çalınamadı, kilit bekleniyor.");
            }
        }

        function testBeepSound() {
            if (!audioCtx) {
                alert("Önce en üstteki KIRMIZI KUTUYA tıklayarak ses kilidini açmalısın!");
                return;
            }
            // Üçlü güçlü bip alarmı tetikler
            playDigitalBeep(587.33, 0.15);
            setTimeout(() => playDigitalBeep(587.33, 0.15), 200);
            setTimeout(() => playDigitalBeep(698.46, 0.3), 400);
        }

        for (let i = 1; i <= totalCH; i++) {
            const chDiv = document.createElement('div');
            chDiv.className = 'ch-box';
            chDiv.innerHTML = `
                <div class="ch-title">CH ${i}</div>
                <div class="timer-row" id="row-metin-${i}">
                    <span class="timer-label">💎 Metin:</span>
                    <span class="timer-display" id="metin-time-${i}">30:00</span>
                    <button class="btn" onclick="startTimer(${i}, 'metin', 1800)">OK</button>
                </div>
                <div class="timer-row" id="row-boss-${i}">
                    <span class="timer-label">👹 Boss:</span>
                    <span class="timer-display" id="boss-time-${i}">60:00</span>
                    <button class="btn" onclick="startTimer(${i}, 'boss', 3600)">OK</button>
                </div>
            `;
            container.appendChild(chDiv);
        }

        function startTimer(ch, type, duration) {
            if (!audioCtx) unlockAudio();
            
            const key = `${ch}-${type}`;
            const rowElement = document.getElementById(`row-${type}-${ch}`);
            const display = document.getElementById(`${type}-time-${ch}`);
            
            rowElement.classList.remove('alarm-active');
            if (intervals[key]) clearInterval(intervals[key]);

            let timeLeft = duration;

            function updateTimer() {
                let minutes = Math.floor(timeLeft / 60);
                let seconds = timeLeft % 60;
                minutes = minutes < 10 ? "0" + minutes : minutes;
                seconds = seconds < 10 ? "0" + seconds : seconds;

                display.innerText = `${minutes}:${seconds}`;

                if (timeLeft <= 0) {
                    clearInterval(intervals[key]);
                    display.innerText = "BİTTİ!";
                    rowElement.classList.add('alarm-active');
                    
                    // Süre bittiğinde 3 kez keskin bip sesi çalar
                    playDigitalBeep(659.25, 0.2);
                    setTimeout(() => playDigitalBeep(659.25, 0.2), 250);
                    setTimeout(() => playDigitalBeep(659.25, 0.4), 500);
                    
                    setTimeout(() => {
                        startTimer(ch, type, duration);
                        rowElement.classList.add('alarm-active');
                    }, 1000);
                } else {
                    timeLeft--;
                }
            }

            updateTimer();
            intervals[key] = setInterval(updateTimer, 1000);
        }
    </script>
</body>
</html>
